<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
        integrity="sha384-JcKb8q3iqJ61gNV9KGb8thSsNjpSL0n8PARn9HuZOnIxN0hoP+VmmDGMN5t9UJ0Z" crossorigin="anonymous" />
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"
        integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"
        integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN"
        crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"
        integrity="sha384-B4gt1jrGC7Jh4AgTPSdUtOBvfO8shuf57BaghqFfPlYxofvL8/KUEfYiJOMMV+rV"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="speedtypingtest.css">
</head>

<body>
    <div class="container speed-typing-test p-5" id="speedTypingTest">
        <div class="row">
            <div class="col-12">
                <h1 class="main-heading">Speed Typing Test</h1>
                <p class="sub-para">On your fingers lets set Go!</p>

                <div class="text-center d-none" id="spinner">
                    <div class="spinner-border" role="status">
                        <span class="visually-hidden"></span>
                    </div>
                </div>

                <div class="d-flex flex-row m-4">
                    <img src="https://assets.ccbp.in/frontend/dynamic-webapps/clock-img.png" class="clock-img" />
                    <p id="timer"></p>
                    <p class="ml-3 mt-4">seconds</p>
                </div>
                <div class="quote-container p-4">
                    <p id="quoteDisplay" class="quote"></p>
                    <textarea id="quoteInput" rows="5" cols="30" placeholder="Type here!!"></textarea>

                </div>
                <p id="result" class="mt-2"></p>
                <div class="mt-4">
                    <button id="submitBtn" class="submit-button">Submit</button>
                    <button id="resetBtn" class="reset-button ml-3">reset</button>
                </div>
            </div>

        </div>
    </div>
    <script src="speedtypingtest.js"></script>
</body>

</html>
